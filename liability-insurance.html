<main class="li-main"><div class="kb-page-heading"><h1>배상책임보험 관리</h1></div><p class="li-intro">안양점·인천점의 전체 현원과 보험 가입 인원, 가입기간을 확인합니다.</p>
<div class="li-toolbar"><p id="li-message" role="status" aria-live="polite">보험 현황을 불러오고 있습니다.</p><button id="li-refresh" class="ui-button" type="button">지금 현원 확인</button></div>
<section id="li-grid" class="li-grid" aria-label="지점별 보험 현황"></section>
<p class="li-source">현원은 ERP의 전체 재원 인원 기준입니다. 인원 차이가 있으면 보험사에 변경을 요청하고, 변경된 가입 인원과 증서를 등록해주세요. 만료일 30일 전부터 갱신 준비를 안내합니다.</p>
<p class="li-source">증서에서 읽은 값은 확인 후 저장해야 합니다. 글자 인식은 이 브라우저에서 진행하며, 저장한 보험 정보와 증서는 서버에 보관됩니다.</p>
